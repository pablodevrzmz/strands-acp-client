[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-acp-client"
dynamic = ["version"]
description = "Use ACP coding agents (Claude Code, OpenCode, the Strands CLI or any other) as tools from a Strands agent: delegate a task, get the result back."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jose Pablo Ramírez Méndez", email = "pablo.dev.rz.mz@gmail.com"}
]
keywords = ["strands", "agents", "ai", "tool", "acp", "agent-client-protocol", "coding-agents", "claude-code", "opencode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "strands-agents>=1.0.0",
    "agent-client-protocol>=1.0.0rc3,<2",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/pablodevrzmz/strands-acp-client"
Documentation = "https://github.com/pablodevrzmz/strands-acp-client#readme"
Repository = "https://github.com/pablodevrzmz/strands-acp-client"
Issues = "https://github.com/pablodevrzmz/strands-acp-client/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<3.0.0",
    "hatch",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_acp_client"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<3.0.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "ruff check src tests"
format = "ruff format src tests"
typecheck = "mypy src"
prepare = ["format", "lint", "typecheck", "test"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "e2e: runs against real coding agents; needs ACP_E2E_AGENTS and the agents logged in",
]
filterwarnings = [
    # pytest-asyncio still touches the event loop policy; Python 3.14 deprecates it.
    "ignore:.*event_loop_policy.*:DeprecationWarning",
]
